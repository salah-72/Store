openapi: 3.0.0
info:
  title: Agricultural Store API - Customers Module
  version: 1.0.0
  description: Customer Accounts and Initial Balance Management API Documentation.

paths:
  /customers:
    get:
      summary: List customers with financial summaries, pagination, and filters
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of customers per page
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
          description: Search by customer name or phone number (case-insensitive)
        - in: query
          name: active
          schema:
            type: string
            enum: [true, false, all]
            default: 'true'
          description: Filter by active status
        - in: query
          name: debtors
          schema:
            type: string
            enum: [true, false]
          description: Filter customers where remaining balance is greater than zero (debtors)
      responses:
        '200':
          description: Customers retrieved successfully with financial summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrichedCustomerResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized

    post:
      summary: Create New Customer
      tags:
        - Customers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerInput'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Validation error or customer name already exists
        '401':
          description: Unauthorized

  /customers/{id}:
    get:
      summary: Get single customer details with financial summary
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Customer ID
      responses:
        '200':
          description: Customer details retrieved successfully with financial summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EnrichedCustomerResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Customer not found

    patch:
      summary: Update Customer Details
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Customer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerInput'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Validation error, duplicate customer name, or empty update body
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
  /customers/{id}/status:
    patch:
      summary: Toggle customer active status
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Customer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCustomerStatusInput'
      responses:
        '200':
          description: Customer active status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Customer not found

components:
  schemas:
    CreateCustomerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'El-Giza Agricultural Cooperative'
        phone:
          type: string
          default: ''
          example: '01012345678'
        openingBalance:
          type: number
          minimum: -9999999.99
          maximum: 9999999.99
          default: 0
          example: 2500.00
          description: 'Signed initial balance (Positive indicates customer owes store, negative indicates store owes customer)'

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'El-Giza Agricultural Cooperative'
        phone:
          type: string
          example: '01012345678'
        openingBalance:
          type: number
          example: 2500.00
        isActive:
          type: boolean
          example: true

    UpdateCustomerInput:
      type: object
      description: All fields are optional (partial update)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'El-Giza Agricultural Cooperative (Updated)'
        phone:
          type: string
          example: '01098765432'
        openingBalance:
          type: number
          minimum: -9999999.99
          maximum: 9999999.99
          example: 3000.00

    SetCustomerStatusInput:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: false
          description: 'Set customer active state (true for active, false for inactive)'

    EnrichedCustomerResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'El-Giza Agricultural Cooperative'
        phone:
          type: string
          example: '01012345678'
        openingBalance:
          type: number
          example: 2500.00
        isActive:
          type: boolean
          example: true
        totalSales:
          type: number
          example: 15000.00
          description: Sum of all sales invoice totals for this customer
        totalReturns:
          type: number
          example: 1000.00
          description: Sum of all sales return totals
        netSales:
          type: number
          example: 14000.00
          description: Total sales minus total returns
        totalPaid:
          type: number
          example: 10000.00
          description: Sum of amounts paid at sale time plus separate payments
        remaining:
          type: number
          example: 6500.00
          description: Current outstanding remaining balance owed by/to the customer

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
