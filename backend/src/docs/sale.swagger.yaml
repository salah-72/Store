openapi: 3.0.0
info:
  title: Agricultural Store API - Sales Module
  version: 1.0.0
  description: Sales Invoices, FEFO Batch Outflow, and Margin Tracking API Documentation.

paths:
  /sales:
    post:
      summary: Create New Sales Invoice (FEFO Inventory Deduction)
      tags:
        - Sales
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleInput'
      responses:
        '201':
          description: Sales invoice created successfully, FEFO batches consumed, and stock updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleDetailResponse'
        '400':
          description: Validation error, customer not found, insufficient stock, or invalid line pricing
        '401':
          description: Unauthorized

  /sales/{id}:
    get:
      summary: Get Sales Invoice Details with Profit and Cost Breakdown
      tags:
        - Sales
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Sale ID
      responses:
        '200':
          description: Sales invoice details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Sale not found

components:
  schemas:
    SaleLineInput:
      type: object
      required:
        - itemId
        - baseQty
      properties:
        itemId:
          type: integer
          minimum: 1
          example: 1
        baseQty:
          type: integer
          minimum: 1
          maximum: 2000000000
          example: 50
          description: Quantity in base units sold
        price:
          type: number
          minimum: 0
          example: 150.00
          description: Unit price (mutually exclusive with lineTotal)
        lineTotal:
          type: number
          minimum: 0
          example: 7500.00
          description: Total line cost (mutually exclusive with price)

    CreateSaleInput:
      type: object
      required:
        - lines
      properties:
        customerId:
          type: integer
          minimum: 1
          nullable: true
          example: 1
          description: Customer ID (null for walk-in / cash sale)
        date:
          type: string
          format: date
          example: '2026-10-12'
          description: Sale date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Paid in full via cash'
        discount:
          type: number
          minimum: 0
          default: 0
          example: 100.00
          description: Invoice-level discount
        paid:
          type: number
          minimum: 0
          example: 7400.00
          description: Amount paid immediately (defaults to subtotal minus discount if omitted)
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SaleLineInput'

    SaleBatchAllocationResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        baseQty:
          type: integer
          example: 50
        unitCost:
          type: number
          example: 120.00
        batch:
          type: object
          properties:
            expiryDate:
              type: string
              format: date-time
              nullable: true
              example: '2028-06-30T00:00:00.000Z'

    SaleLineResponse:
      type: object
      properties:
        id:
          type: integer
          example: 3
        saleId:
          type: integer
          example: 12
        itemId:
          type: integer
          example: 1
        baseQty:
          type: integer
          example: 50
        lineTotal:
          type: number
          example: 7500.00
        cost:
          type: number
          example: 6000.00
          description: Total acquisition cost for the consumed batches
        profit:
          type: number
          example: 1500.00
          description: Line profit (lineTotal minus cost)
        belowCost:
          type: boolean
          example: false
          description: Flag indicating if the line was sold below cost
        item:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Urea Fertilizer 46%'
            unit:
              type: string
              example: 'GRAM'
            priceBasis:
              type: string
              example: 'BASE'
        batches:
          type: array
          items:
            $ref: '#/components/schemas/SaleBatchAllocationResponse'
          description: FEFO batch allocations consumed for this line

    SaleReturnSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-14T10:00:00.000Z'
        total:
          type: number
          example: 1500.00
        cashRefund:
          type: number
          example: 500.00

    SaleDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 12
        customerId:
          type: integer
          nullable: true
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-12T00:00:00.000Z'
        discount:
          type: number
          example: 100.00
        total:
          type: number
          example: 7400.00
        paid:
          type: number
          example: 7400.00
        note:
          type: string
          nullable: true
          example: 'Paid in full via cash'
        subtotal:
          type: number
          example: 7500.00
        cost:
          type: number
          example: 6000.00
          description: Total inventory acquisition cost for the entire invoice
        profit:
          type: number
          example: 1400.00
          description: Net invoice profit (total minus cost)
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'El-Giza Agricultural Cooperative'
            phone:
              type: string
              example: '01012345678'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLineResponse'
        returns:
          type: array
          items:
            $ref: '#/components/schemas/SaleReturnSummaryResponse'
