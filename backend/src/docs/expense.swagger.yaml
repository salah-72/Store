openapi: 3.0.0
info:
  title: Agricultural Store API - Expenses Module
  version: 1.0.0
  description: Operational Expenses Tracking and Financial Outflow API Documentation.

paths:
  /expenses:
    get:
      summary: List expenses with pagination, category filtering, search, date ranges, and analytics summaries
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of expense records per page
        - in: query
          name: category
          schema:
            type: string
            maxLength: 50
            example: 'Utilities'
          description: Filter expenses by canonical category name
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
            example: 'Electricity'
          description: Search query matching note content (case-insensitive)
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-01-01'
          description: Start date filter (YYYY-MM-DD)
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-12-31'
          description: End date filter (YYYY-MM-DD, inclusive)
      responses:
        '200':
          description: Expenses retrieved successfully with category breakdown and totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseListItemResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  amount:
                    type: number
                    example: 12500.00
                    description: Total sum of expense amounts matching filter criteria
                  byCategory:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategorySummaryResponse'

    post:
      summary: Record New Operational Expense
      tags:
        - Expenses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseInput'
      responses:
        '201':
          description: Expense recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Validation error, missing category, or invalid amount
        '401':
          description: Unauthorized

  /expenses/{id}:
    get:
      summary: Get Expense Details by ID
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Expense ID
      responses:
        '200':
          description: Expense details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Expense not found

    patch:
      summary: Update Expense Details (Category, Amount, Date, Notes)
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Expense ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseInput'
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Validation error, empty update body, or invalid amount
        '401':
          description: Unauthorized
        '404':
          description: Expense not found

    delete:
      summary: Delete Expense Record
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Expense ID
      responses:
        '200':
          description: Expense deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
  /expense/categories:
    get:
      summary: List all unique expense categories with aggregated counts, total amounts, and last-used dates
      tags:
        - Expenses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Expense categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategoryDetailResponse'
        '401':
          description: Unauthorized

components:
  schemas:
    CreateExpenseInput:
      type: object
      required:
        - category
        - amount
      properties:
        category:
          type: string
          maxLength: 50
          example: 'Utilities'
          description: Expense category (e.g., Utilities, Rent, Salaries, Transport)
        amount:
          type: number
          minimum: 0.01
          example: 1200.50
          description: Expense amount (must be greater than zero)
        date:
          type: string
          format: date
          example: '2026-10-15'
          description: Expense date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Electricity bill for warehouse and office storage'

    ExpenseResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        category:
          type: string
          example: 'Utilities'
        amount:
          type: number
          example: 1200.50
        date:
          type: string
          format: date-time
          example: '2026-10-15T00:00:00.000Z'
        note:
          type: string
          nullable: true
          example: 'Electricity bill for warehouse and office storage'

    UpdateExpenseInput:
      type: object
      description: All fields are optional (partial update for expense record)
      properties:
        category:
          type: string
          maxLength: 50
          example: 'Maintenance'
          description: Updated expense category
        amount:
          type: number
          minimum: 0.01
          example: 1500.00
          description: Updated expense amount (must be greater than zero)
        date:
          type: string
          format: date
          example: '2026-10-16'
          description: Expense date in YYYY-MM-DD format
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated notes regarding generator repair service'

    ExpenseListItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        category:
          type: string
          example: 'Utilities'
        amount:
          type: number
          example: 1200.50
        date:
          type: string
          format: date-time
          example: '2026-10-15T00:00:00.000Z'
        note:
          type: string
          nullable: true
          example: 'Electricity bill for warehouse and office storage'

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5

    ExpenseCategoryDetailResponse:
      type: object
      properties:
        category:
          type: string
          example: 'Utilities'
        count:
          type: integer
          example: 12
          description: Total number of expense records under this category
        amount:
          type: number
          example: 18500.00
          description: Total financial sum of expenses under this category
        lastUsed:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-15T00:00:00.000Z'
          description: Date of the most recent expense recorded in this category

    ExpenseCategorySummaryResponse:
      type: object
      properties:
        category:
          type: string
          example: 'Utilities'
        amount:
          type: number
          example: 4500.00
        count:
          type: integer
          example: 3
