openapi: 3.0.0
info:
  title: Agricultural Store API - Purchase Returns Module
  version: 1.0.0
  description: Purchase Returns, Supplier Outflow Adjustments, and Inventory Stock Reduction API Documentation.

paths:
  /purchase-returns:
    post:
      summary: Create New Purchase Return (Inventory Batch Stock Decremented & Supplier Credit Recorded)
      tags:
        - Purchase Returns
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseReturnInput'
      responses:
        '201':
          description: Purchase return created successfully, batch inventory reduced, and supplier credit/refund recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseReturnDetailResponse'
        '400':
          description: Validation error, purchase not found, return quantity exceeds purchased quantity, or invalid batch quantity
        '401':
          description: Unauthorized

  /purchase-returns/{id}:
    get:
      summary: Get Purchase Return Details
      tags:
        - Purchase Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Purchase Return ID
      responses:
        '200':
          description: Purchase return details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseReturnDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Purchase return not found

    patch:
      summary: Update Purchase Return (Date, Cash Refund, Notes)
      tags:
        - Purchase Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Purchase Return ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePurchaseReturnInput'
      responses:
        '200':
          description: Purchase return updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseReturnDetailResponse'
        '400':
          description: Validation error, empty update body, return date before purchase date, or invalid cash refund amount
        '401':
          description: Unauthorized
        '404':
          description: Purchase return not found

    delete:
      summary: Delete Purchase Return (Batch Inventory Restored)
      tags:
        - Purchase Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Purchase Return ID
      responses:
        '200':
          description: Purchase return deleted successfully and stock inventory incremented back to batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          description: Unauthorized
        '404':
          description: Purchase return not found

components:
  schemas:
    InvoiceLineInput:
      type: object
      required:
        - purchaseLineId
        - baseQty
      properties:
        purchaseLineId:
          type: integer
          minimum: 1
          example: 5
          description: ID of the original purchase line being returned to the supplier
        baseQty:
          type: integer
          minimum: 1
          maximum: 2000000000
          example: 20
          description: Quantity returned in base units

    CreatePurchaseReturnInput:
      type: object
      required:
        - purchaseId
        - lines
      properties:
        purchaseId:
          type: integer
          minimum: 1
          example: 8
          description: Target original Purchase invoice ID
        date:
          type: string
          format: date
          example: '2026-10-14'
          description: Return date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Returned damaged fertilizer bags from shipment'
        cashRefund:
          type: number
          minimum: 0
          example: 0.00
          description: Cash refunded immediately by the supplier (defaults to 0 for supplier account credits)
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvoiceLineInput'

    PurchaseReturnBatchResponse:
      type: object
      properties:
        id:
          type: integer
          example: 15
        expiryDate:
          type: string
          format: date-time
          nullable: true
          example: '2028-06-30T00:00:00.000Z'
        qtyRemaining:
          type: integer
          example: 80
          description: Current remaining quantity in the batch

    PurchaseReturnLineResponse:
      type: object
      properties:
        id:
          type: integer
          example: 2
        purchaseReturnId:
          type: integer
          example: 1
        itemId:
          type: integer
          example: 1
        baseQty:
          type: integer
          example: 20
          description: Quantity returned to supplier in base units
        lineTotal:
          type: number
          example: 2500.00
          description: Refund/credit value for this line
        item:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Urea Fertilizer 46%'
            unit:
              type: string
              example: 'GRAM'
        batch:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 15
            expiryDate:
              type: string
              format: date-time
              nullable: true
              example: '2028-06-30T00:00:00.000Z'
            qtyRemaining:
              type: integer
              example: 80

    PurchaseReturnDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        purchaseId:
          type: integer
          example: 8
        supplierId:
          type: integer
          example: 3
        date:
          type: string
          format: date-time
          example: '2026-10-14T10:00:00.000Z'
        total:
          type: number
          example: 2500.00
          description: Total financial credit or cash refund received from supplier
        cashRefund:
          type: number
          example: 0.00
          description: Cash amount refunded immediately by supplier
        note:
          type: string
          nullable: true
          example: 'Returned damaged fertilizer bags from shipment'
        supplier:
          type: object
          properties:
            id:
              type: integer
              example: 3
            name:
              type: string
              example: 'Delta Agricultural Supplies Co.'
        purchase:
          type: object
          properties:
            id:
              type: integer
              example: 8
            date:
              type: string
              format: date-time
              example: '2026-10-10T00:00:00.000Z'
            total:
              type: number
              example: 10000.00
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReturnLineResponse'

    UpdatePurchaseReturnInput:
      type: object
      description: All fields are optional (partial update for purchase return metadata)
      properties:
        date:
          type: string
          format: date
          example: '2026-10-15'
          description: Return date in YYYY-MM-DD format (cannot be prior to parent purchase date)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated return notes regarding supplier credit memo agreement'
        cashRefund:
          type: number
          minimum: 0
          example: 200.00
          description: Updated immediate cash refund received from supplier
