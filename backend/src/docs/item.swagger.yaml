openapi: 3.0.0
info:
  title: Agricultural Store API - Items Module
  version: 1.0.0
  description: Inventory Item Catalog and Stock Unit Management API Documentation.

paths:
  /items:
    get:
      summary: List items with stock details, pagination, and filters
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
          description: Search by item name (case-insensitive)
        - in: query
          name: unit
          schema:
            type: string
            enum: [PIECE, GRAM, ML]
          description: Filter by stock unit type
        - in: query
          name: active
          schema:
            type: string
            enum: [true, false, all]
            default: 'true'
          description: Filter by active status
        - in: query
          name: lowStock
          schema:
            type: string
            enum: [true, false]
          description: Filter items where sellable stock is less than or equal to reorder level
      responses:
        '200':
          description: Items retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrichedItemResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized

    post:
      summary: Create New Item
      tags:
        - Items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemInput'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error, duplicate item name, or invalid package parameters
        '401':
          description: Unauthorized

  /items/{id}:
    get:
      summary: Get single item details with active batches
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Item ID
      responses:
        '200':
          description: Item details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Item not found

    patch:
      summary: Update Item Details
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemInput'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error or empty update body
        '404':
          description: Item not found
        '409':
          description: Unit cannot be updated because the item has associated stock movements

  /items/{id}/status:
    patch:
      summary: Toggle Item Active Status
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetItemStatusInput'
      responses:
        '200':
          description: Item active status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Item not found

components:
  schemas:
    CreateItemInput:
      type: object
      required:
        - name
        - unit
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: 'Urea Fertilizer 46%'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: 'Nitrogen fertilizer for vegetative growth'
        unit:
          type: string
          enum: [PIECE, GRAM, ML]
          example: 'GRAM'
          description: 'PIECE for equipment, GRAM for mass, ML for liquids'
        price:
          type: number
          minimum: 0
          example: 750.50
        priceBasis:
          type: integer
          minimum: 1
          example: 1000
        packName:
          type: string
          maxLength: 50
          nullable: true
          example: 'Sack'
        packSize:
          type: integer
          minimum: 1
          nullable: true
          example: 25000
        reorderLevel:
          type: integer
          minimum: 0
          default: 0
          example: 10

    UpdateItemInput:
      type: object
      description: All fields are optional
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: 'Urea Fertilizer 46% (Modified)'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated product description'
        unit:
          type: string
          enum: [PIECE, GRAM, ML]
        price:
          type: number
          minimum: 0
          example: 800.00
        priceBasis:
          type: integer
          minimum: 1
        packName:
          type: string
          maxLength: 50
          nullable: true
        packSize:
          type: integer
          minimum: 1
          nullable: true
        reorderLevel:
          type: integer
          minimum: 0

    SetItemStatusInput:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: false
          description: 'Set item active state (true for active, false for inactive)'

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Urea Fertilizer 46%'
        description:
          type: string
          nullable: true
          example: 'Nitrogen fertilizer for vegetative growth'
        unit:
          type: string
          example: 'GRAM'
        price:
          type: number
          example: 750.50
        priceBasis:
          type: integer
          example: 1000
        packName:
          type: string
          nullable: true
          example: 'Sack'
        packSize:
          type: integer
          nullable: true
          example: 25000
        reorderLevel:
          type: integer
          example: 10
        isActive:
          type: boolean
          example: true

    EnrichedItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Urea Fertilizer 46%'
        description:
          type: string
          nullable: true
          example: 'Nitrogen fertilizer for vegetative growth'
        unit:
          type: string
          example: 'GRAM'
        price:
          type: number
          example: 750.50
        priceBasis:
          type: integer
          example: 1000
        packName:
          type: string
          nullable: true
          example: 'Sack'
        packSize:
          type: integer
          nullable: true
          example: 25000
        reorderLevel:
          type: integer
          example: 10
        isActive:
          type: boolean
          example: true
        stock:
          type: integer
          example: 50000
        sellable:
          type: integer
          example: 45000
        expiredStock:
          type: integer
          example: 5000
        nearestExpiry:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-31T00:00:00.000Z'
        lowStock:
          type: boolean
          example: false

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5

    BatchResponse:
      type: object
      properties:
        id:
          type: integer
          example: 101
        itemId:
          type: integer
          example: 1
        qtyRemaining:
          type: integer
          example: 25000
          description: Remaining quantity in this batch
        costPrice:
          type: number
          example: 600.00
          description: Purchase/cost price per unit for this batch
        expiryDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-31T00:00:00.000Z'
        hasExpiry:
          type: boolean
          example: true
        expired:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00.000Z'

    ItemDetailResponse:
      allOf:
        - $ref: '#/components/schemas/EnrichedItemResponse'
        - type: object
          properties:
            batches:
              type: array
              items:
                $ref: '#/components/schemas/BatchResponse'
              description: Active inventory batches sorted by expiry date ascending (FEFO)
