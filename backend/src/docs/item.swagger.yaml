openapi: 3.0.0
info:
  title: Agricultural Store API - Items Module
  version: 1.0.0
  description: Inventory Item Catalog and Stock Unit Management API Documentation.

paths:
  /items:
    post:
      summary: Create New Item
      tags:
        - Items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemInput'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error, duplicate item name, or invalid package parameters
        '401':
          description: Unauthorized

  /items/{id}:
    patch:
      summary: Update Item Details
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemInput'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error or empty update body
        '404':
          description: Item not found
        '409':
          description: Unit cannot be updated because the item has associated stock movements

  /items/{id}/status:
    patch:
      summary: Toggle Item Active Status
      tags:
        - Items
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetItemStatusInput'
      responses:
        '200':
          description: Item active status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Item not found

components:
  schemas:
    CreateItemInput:
      type: object
      required:
        - name
        - unit
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: 'Urea Fertilizer 46%'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: 'Nitrogen fertilizer for vegetative growth'
        unit:
          type: string
          enum: [PIECE, GRAM, ML]
          example: 'GRAM'
          description: 'PIECE for equipment, GRAM for mass, ML for liquids'
        price:
          type: number
          minimum: 0
          example: 750.50
          description: 'Price corresponding to priceBasis'
        priceBasis:
          type: integer
          minimum: 1
          example: 1000
          description: 'Base unit quantity for price calculation (e.g., 1000 grams = 1 kg). Defaults to 1 for PIECE and 1000 for GRAM/ML.'
        packName:
          type: string
          maxLength: 50
          nullable: true
          example: 'Sack'
        packSize:
          type: integer
          minimum: 1
          nullable: true
          example: 25000
          description: 'Package size in smallest base units (e.g., 25000 grams per sack)'
        reorderLevel:
          type: integer
          minimum: 0
          default: 0
          example: 10
          description: 'Threshold quantity for stock reorder alerts'

    UpdateItemInput:
      type: object
      description: All fields are optional
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: 'Urea Fertilizer 46% (Modified)'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated product description'
        unit:
          type: string
          enum: [PIECE, GRAM, ML]
        price:
          type: number
          minimum: 0
          example: 800.00
        priceBasis:
          type: integer
          minimum: 1
        packName:
          type: string
          maxLength: 50
          nullable: true
        packSize:
          type: integer
          minimum: 1
          nullable: true
        reorderLevel:
          type: integer
          minimum: 0

    SetItemStatusInput:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: false
          description: 'Set item active state (true for active, false for inactive)'

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Urea Fertilizer 46%'
        description:
          type: string
          nullable: true
          example: 'Nitrogen fertilizer for vegetative growth'
        unit:
          type: string
          example: 'GRAM'
        price:
          type: number
          example: 750.50
        priceBasis:
          type: integer
          example: 1000
        packName:
          type: string
          nullable: true
          example: 'Sack'
        packSize:
          type: integer
          nullable: true
          example: 25000
        reorderLevel:
          type: integer
          example: 10
        isActive:
          type: boolean
          example: true
