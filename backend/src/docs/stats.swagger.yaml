openapi: 3.0.0
info:
  title: Agricultural Store API - Financial Analytics & Dashboard Overview
  version: 1.0.0
  description: Comprehensive Financial Reporting, COGS, Gross/Net Profit, and Cash Flow Analytics API Documentation.

paths:
  /overview:
    get:
      summary: Get Comprehensive Financial Overview and Dashboard Metrics for a Date Range
      tags:
        - Financial Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-10-01'
          description: Start date filter (YYYY-MM-DD). Defaults to the 1st of the current month if omitted.
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-10-15'
          description: End date filter (YYYY-MM-DD, inclusive). Defaults to current Cairo date if omitted.
      responses:
        '200':
          description: Financial overview data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OverviewResponse'
        '400':
          description: Invalid date parameters or date range
        '401':
          description: Unauthorized
  /sales-by-day:
    get:
      summary: Get Daily Sales and Returns Time-Series Analytics
      tags:
        - Financial Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-09-15'
          description: Start date filter (YYYY-MM-DD). Defaults to 30 days prior to end date if omitted.
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-10-15'
          description: End date filter (YYYY-MM-DD, inclusive). Defaults to current Cairo date if omitted.
      responses:
        '200':
          description: Daily sales time-series data and summary metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SalesByDayResponse'
        '400':
          description: Invalid date parameters or date range
        '401':
          description: Unauthorized
  /top-items:
    get:
      summary: Get Top-Performing Inventory Items Ranked by Revenue or Quantity
      tags:
        - Financial Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-10-01'
          description: Start date filter (YYYY-MM-DD). Defaults to 1st of current month if omitted.
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-10-16'
          description: End date filter (YYYY-MM-DD, inclusive). Defaults to current Cairo date if omitted.
        - in: query
          name: by
          schema:
            type: string
            enum: [revenue, quantity]
            default: revenue
          description: Metric to rank items by (gross revenue or total quantity sold net of returns)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of items to return
      responses:
        '200':
          description: Top items ranked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TopItemsResponse'
        '400':
          description: Invalid date parameters or query range
        '401':
          description: Unauthorized
  /stale-stock:
    get:
      summary: Get Stale/Dormant Inventory Stock Analysis and Tied-Up Capital
      tags:
        - Financial Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 7
            maximum: 730
            default: 90
          description: Inactivity threshold in days (items with no sales or purchases within this period are flagged as stale)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
          description: Maximum number of stale items to return in the list
      responses:
        '200':
          description: Stale stock analysis retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/StaleStockResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized
  /dashboard:
    get:
      summary: Get Executive Dashboard Summary (Financials, Working Capital, Inventory Valuation, and Operational Alerts)
      tags:
        - Financial Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: expiryDays
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: Threshold in days for flagging near-expiry batch inventory alerts
      responses:
        '200':
          description: Executive dashboard summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized

components:
  schemas:
    OverviewResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              example: '2026-10-01'
            to:
              type: string
              example: '2026-10-15'
        sales:
          type: object
          properties:
            count:
              type: integer
              example: 42
            subtotal:
              type: number
              example: 125000.00
            discount:
              type: number
              example: 5000.00
            total:
              type: number
              example: 120000.00
            returns:
              type: number
              example: 4000.00
            net:
              type: number
              example: 116000.00
        cost:
          type: object
          properties:
            sold:
              type: number
              example: 85000.00
            returned:
              type: number
              example: 2800.00
            net:
              type: number
              example: 82200.00
        grossProfit:
          type: number
          example: 33800.00
        expenses:
          type: object
          properties:
            total:
              type: number
              example: 12400.00
            byCategory:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    example: 'Utilities'
                  amount:
                    type: number
                    example: 4500.00
                  count:
                    type: integer
                    example: 3
        purchaseDiscounts:
          type: number
          example: 3200.00
        writeOffs:
          type: number
          example: 1500.00
        netProfit:
          type: number
          example: 23100.00
        purchases:
          type: object
          properties:
            count:
              type: integer
              example: 15
            subtotal:
              type: number
              example: 95000.00
            discount:
              type: number
              example: 3200.00
            total:
              type: number
              example: 91800.00
            returns:
              type: number
              example: 5000.00
            net:
              type: number
              example: 86800.00
        cashFlow:
          type: object
          properties:
            in:
              type: number
              example: 110000.00
            out:
              type: number
              example: 95000.00
            net:
              type: number
              example: 15000.00
            parts:
              type: object
              properties:
                paidOnSales:
                  type: number
                  example: 80000.00
                customerPayments:
                  type: number
                  example: 28000.00
                supplierRefunds:
                  type: number
                  example: 2000.00
                paidOnPurchases:
                  type: number
                  example: 70000.00
                supplierPayments:
                  type: number
                  example: 12600.00
                customerRefunds:
                  type: number
                  example: 0.00
                expenses:
                  type: number
                  example: 12400.00

    SalesByDayResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              example: '2026-09-15'
            to:
              type: string
              example: '2026-10-15'
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailySalesItemResponse'
        summary:
          type: object
          properties:
            count:
              type: integer
              example: 145
              description: Total number of sales transactions across the period
            sales:
              type: number
              example: 450000.00
              description: Total gross sales across the period
            returns:
              type: number
              example: 12500.00
              description: Total sales returns across the period
            net:
              type: number
              example: 437500.00
              description: Net sales (gross sales minus returns) across the period

    DailySalesItemResponse:
      type: object
      properties:
        date:
          type: string
          example: '2026-10-15'
        count:
          type: integer
          example: 5
        sales:
          type: number
          example: 15400.00
        returns:
          type: number
          example: 0.00
        net:
          type: number
          example: 15400.00

    TopItemsResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              example: '2026-10-01'
            to:
              type: string
              example: '2026-10-16'
        by:
          type: string
          enum: [revenue, quantity]
          example: 'revenue'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopItemItemResponse'

    TopItemItemResponse:
      type: object
      properties:
        itemId:
          type: integer
          example: 3
        soldQty:
          type: number
          example: 1250.00
          description: Net quantity sold (total sold minus returns) in base units
        returnedQty:
          type: number
          example: 45000.00
          description: Total revenue generated by this item
        netQty:
          type: number
          example: 45000.00
          description: Total revenue generated by this item
        revenue:
          type: number
          example: 45000.00
          description: Total revenue generated by this item
        name:
          type: string
          example: 'Urea Fertilizer 46%'
        unit:
          type: string
          nullable: true
          example: 'KG'

    StaleStockResponse:
      type: object
      properties:
        days:
          type: integer
          example: 90
          description: Inactivity window used for flagging stale stock
        count:
          type: integer
          example: 12
          description: Total number of unique items flagged as stale
        value:
          type: number
          example: 45200.00
          description: Total financial value of capital tied up across all stale inventory
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaleStockItemResponse'

    StaleStockItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 14
        name:
          type: string
          example: 'Specialized Fungicide X'
        unit:
          type: string
          nullable: true
          example: 'LITER'
        qtyRemaining:
          type: number
          example: 150.00
          description: Total remaining quantity in stock across active batches
        value:
          type: number
          example: 12500.00
          description: Total financial value of remaining stock for this item
        lastActivityDate:
          type: string
          format: date-time
          nullable: true
          example: '2025-06-10T00:00:00.000Z'
          description: Date of the last recorded sale or purchase

    DashboardResponse:
      type: object
      properties:
        today:
          type: object
          properties:
            date:
              type: string
              example: '2026-10-16'
            salesCount:
              type: integer
              example: 18
            sales:
              type: number
              example: 45200.00
            returns:
              type: number
              example: 1200.00
            net:
              type: number
              example: 44000.00
        month:
          type: object
          properties:
            from:
              type: string
              example: '2026-10-01'
            to:
              type: string
              example: '2026-10-16'
            netSales:
              type: number
              example: 315000.00
            grossProfit:
              type: number
              example: 92000.00
            expenses:
              type: number
              example: 18400.00
            netProfit:
              type: number
              example: 73600.00
        receivables:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEntityOwedResponse'
        payables:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEntityOwedResponse'
        last7Days:
          type: array
          items:
            $ref: '#/components/schemas/DailySalesItemResponse'
        stock:
          type: object
          properties:
            value:
              type: number
              example: 1450000.00
              description: Total active inventory valuation based on remaining quantities and batch unit costs
            expiredValue:
              type: number
              example: 3500.00
              description: Total financial value trapped in expired batches
        alerts:
          type: object
          properties:
            lowStock:
              type: object
              properties:
                count:
                  type: integer
                  example: 3
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Glyphosate Herbicide 48%'
                      unit:
                        type: string
                        example: 'LITER'
                      reorderLevel:
                        type: number
                        example: 50.00
            nearExpiry:
              type: object
              properties:
                days:
                  type: integer
                  example: 30
                count:
                  type: integer
                  example: 2
                batches:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 22
                      itemId:
                        type: integer
                        example: 8
                      qtyRemaining:
                        type: number
                        example: 45.00
                      expiryDate:
                        type: string
                        format: date-time
                        example: '2026-11-05T00:00:00.000Z'
            expired:
              type: object
              properties:
                count:
                  type: integer
                  example: 1
                value:
                  type: number
                  example: 1200.00
                batches:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 14
                      itemId:
                        type: integer
                        example: 3
                      qtyRemaining:
                        type: number
                        example: 10.00
                      expiryDate:
                        type: string
                        format: date-time
                        example: '2026-09-30T00:00:00.000Z'

    DashboardEntityOwedResponse:
      type: object
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: 'Green Valley Agricultural Coop'
        remaining:
          type: number
          example: 14200.00
          description: Outstanding balance owed (receivable) or owed to (payable)
