openapi: 3.0.0
info:
  title: Agricultural Store API - Sale Returns Module
  version: 1.0.0
  description: Sales Return, Inventory Restocking, and Refund Accounting API Documentation.

paths:
  /sale-returns:
    get:
      summary: List sale returns with pagination, customer/sale filters, and date ranges
      tags:
        - Sale Returns
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of sale returns per page
        - in: query
          name: customerId
          schema:
            type: integer
            minimum: 1
          description: Filter returns by specific customer ID
        - in: query
          name: saleId
          schema:
            type: integer
            minimum: 1
          description: Filter returns by specific parent sale invoice ID
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-01-01'
          description: Start date filter (YYYY-MM-DD)
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-12-31'
          description: End date filter (YYYY-MM-DD, inclusive)
      responses:
        '200':
          description: Sale returns retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleReturnListItemResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          description: Invalid query parameters or date range
        '401':
          description: Unauthorized

    post:
      summary: Create New Sale Return (Inventory Restocked & Refund Recorded)
      tags:
        - Sale Returns
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleReturnInput'
      responses:
        '201':
          description: Sale return created successfully, stock batches replenished, and credit/refund recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleReturnDetailResponse'
        '400':
          description: Validation error, sale not found, return quantity exceeds sold quantity, or invalid cash refund amount
        '401':
          description: Unauthorized

  /sale-returns/{id}:
    get:
      summary: Get Sales Return Details
      tags:
        - Sale Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Sale Return ID
      responses:
        '200':
          description: Sale return details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleReturnDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Sale return not found

    patch:
      summary: Update Sales Return (Date, Cash Refund, Notes)
      tags:
        - Sale Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Sale Return ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaleReturnInput'
      responses:
        '200':
          description: Sale return updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleReturnDetailResponse'
        '400':
          description: Validation error, return date before sale date, or invalid cash refund amount
        '401':
          description: Unauthorized
        '404':
          description: Sale return not found

    delete:
      summary: Delete Sales Return (Restored Inventory Re-reversed)
      tags:
        - Sale Returns
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Sale Return ID
      responses:
        '200':
          description: Sale return deleted successfully and stock inventory decremented from batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          description: Unauthorized
        '404':
          description: Sale return not found
        '409':
          description: Conflict - Returned goods from this return were already resold and cannot be reversed

components:
  schemas:
    InvoiceLineInput:
      type: object
      required:
        - saleLineId
        - baseQty
      properties:
        saleLineId:
          type: integer
          minimum: 1
          example: 3
          description: ID of the original sale line being returned
        baseQty:
          type: integer
          minimum: 1
          maximum: 2000000000
          example: 10
          description: Quantity returned in base units
        lineTotal:
          type: number
          minimum: 0
          example: 1500.00
          description: Refund value for this returned quantity (auto-calculated if omitted)

    CreateSaleReturnInput:
      type: object
      required:
        - saleId
        - lines
      properties:
        saleId:
          type: integer
          minimum: 1
          example: 12
          description: Target original Sale invoice ID
        date:
          type: string
          format: date
          example: '2026-10-14'
          description: Return date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Customer returned unused bags due to project downsizing'
        cashRefund:
          type: number
          minimum: 0
          example: 500.00
          description: Cash refunded immediately (defaults to total for cash sales, or 0 for customer account credits)
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvoiceLineInput'

    SaleReturnBatchResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        expiryDate:
          type: string
          format: date-time
          nullable: true
          example: '2028-06-30T00:00:00.000Z'

    SaleReturnLineResponse:
      type: object
      properties:
        id:
          type: integer
          example: 4
        saleReturnId:
          type: integer
          example: 1
        itemId:
          type: integer
          example: 1
        baseQty:
          type: integer
          example: 10
          description: Quantity returned in base units
        lineTotal:
          type: number
          example: 1500.00
          description: Refund value for this line
        item:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Urea Fertilizer 46%'
            unit:
              type: string
              example: 'GRAM'
        batch:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 10
            expiryDate:
              type: string
              format: date-time
              nullable: true
              example: '2028-06-30T00:00:00.000Z'

    SaleReturnDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        saleId:
          type: integer
          example: 12
        customerId:
          type: integer
          nullable: true
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-14T10:00:00.000Z'
        total:
          type: number
          example: 1500.00
          description: Total financial credit granted for the return
        cashRefund:
          type: number
          example: 500.00
          description: Cash amount refunded immediately to the customer
        note:
          type: string
          nullable: true
          example: 'Customer returned unused bags due to project downsizing'
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'El-Giza Agricultural Cooperative'
        sale:
          type: object
          properties:
            id:
              type: integer
              example: 12
            date:
              type: string
              format: date-time
              example: '2026-10-12T00:00:00.000Z'
            total:
              type: number
              example: 7400.00
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleReturnLineResponse'

    UpdateSaleReturnInput:
      type: object
      description: All fields are optional (partial update for sale return metadata)
      properties:
        date:
          type: string
          format: date
          example: '2026-10-15'
          description: Return date in YYYY-MM-DD format (cannot be prior to parent sale date)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated return notes regarding manager approval'
        cashRefund:
          type: number
          minimum: 0
          example: 600.00
          description: Updated immediate cash refund amount

    SaleReturnListItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        saleId:
          type: integer
          example: 12
        customerId:
          type: integer
          nullable: true
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-14T00:00:00.000Z'
        total:
          type: number
          example: 1500.00
          description: Total financial credit granted for the return
        cashRefund:
          type: number
          example: 500.00
          description: Cash amount refunded immediately
        note:
          type: string
          nullable: true
          example: 'Customer returned unused bags'
        linesCount:
          type: integer
          example: 2
          description: Total number of item lines in this return
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'El-Giza Agricultural Cooperative'

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
