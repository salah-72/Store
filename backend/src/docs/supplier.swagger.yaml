openapi: 3.0.0
info:
  title: Agricultural Store API - Suppliers Module
  version: 1.0.0
  description: Supplier Accounts and Initial Balance Management API Documentation.

paths:
  /suppliers:
    get:
      summary: List suppliers with financial summaries, pagination, and filters
      tags:
        - Suppliers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of suppliers per page
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
          description: Search by supplier name or phone number (case-insensitive)
        - in: query
          name: active
          schema:
            type: string
            enum: [true, false, all]
            default: 'true'
          description: Filter by active status
        - in: query
          name: owed
          schema:
            type: boolean
          description: Filter suppliers where remaining balance is greater than zero (owed balance)
      responses:
        '200':
          description: Suppliers retrieved successfully with financial summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrichedSupplierResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized

    post:
      summary: Create New Supplier
      tags:
        - Suppliers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierInput'
      responses:
        '201':
          description: Supplier created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Validation error or supplier name already exists
        '401':
          description: Unauthorized

  /suppliers/{id}:
    get:
      summary: Get single supplier details with financial summary
      tags:
        - Suppliers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Supplier ID
      responses:
        '200':
          description: Supplier details retrieved successfully with financial summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EnrichedSupplierResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Supplier not found

    patch:
      summary: Update Supplier Details
      tags:
        - Suppliers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Supplier ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierInput'
      responses:
        '200':
          description: Supplier updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Validation error, duplicate supplier name, or empty update body
        '401':
          description: Unauthorized
        '404':
          description: Supplier not found

  /suppliers/{id}/status:
    patch:
      summary: Toggle supplier active status
      tags:
        - Suppliers
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Supplier ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSupplierStatusInput'
      responses:
        '200':
          description: Supplier active status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Supplier not found

components:
  schemas:
    CreateSupplierInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Delta AgriChem Supplies'
        phone:
          type: string
          default: ''
          example: '01001234567'
        openingBalance:
          type: number
          minimum: -9999999.99
          maximum: 9999999.99
          default: 0
          example: -15000.00
          description: 'Signed initial balance (Negative indicates store owes supplier, positive indicates supplier owes store)'

    UpdateSupplierInput:
      type: object
      description: All fields are optional (partial update)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Delta AgriChem Trading Co.'
        phone:
          type: string
          example: '01098765432'
        openingBalance:
          type: number
          minimum: -9999999.99
          maximum: 9999999.99
          example: 0

    SupplierResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Delta AgriChem Supplies'
        phone:
          type: string
          example: '01001234567'
        openingBalance:
          type: number
          example: -15000.00
        isActive:
          type: boolean
          example: true

    SetSupplierStatusInput:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: false
          description: 'Set supplier active state (true for active, false for inactive)'

    EnrichedSupplierResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Delta AgriChem Supplies'
        phone:
          type: string
          example: '01001234567'
        openingBalance:
          type: number
          example: 5000.00
        isActive:
          type: boolean
          example: true
        totalPurchases:
          type: number
          example: 25000.00
          description: Sum of all purchase totals for this supplier
        totalReturns:
          type: number
          example: 2000.00
          description: Sum of all purchase return totals
        netPurchases:
          type: number
          example: 23000.00
          description: Total purchases minus total returns
        totalPaid:
          type: number
          example: 15000.00
          description: Sum of amounts paid at purchase time plus separate payments
        remaining:
          type: number
          example: 13000.00
          description: Current outstanding remaining balance owed to/from the supplier

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
