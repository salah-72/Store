openapi: 3.0.0
info:
  title: Agricultural Store API - Purchases Module
  version: 1.0.0
  description: Purchase Invoices and Batch Stock Inflow Management API Documentation.

paths:
  /purchases:
    post:
      summary: Create New Purchase Invoice
      tags:
        - Purchases
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseInput'
      responses:
        '201':
          description: Purchase invoice created successfully and stock batches updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseDetailResponse'
        '400':
          description: Validation error, supplier not found, or invalid line quantities
        '401':
          description: Unauthorized
        '404':
          description: Supplier not found

  /purchases/{id}:
    get:
      summary: Get Purchase Invoice Details
      tags:
        - Purchases
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Purchase ID
      responses:
        '200':
          description: Purchase invoice details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Purchase not found

    patch:
      summary: Update Purchase Invoice
      tags:
        - Purchases
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Purchase ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePurchaseInput'
      responses:
        '200':
          description: Purchase invoice updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PurchaseDetailResponse'
        '400':
          description: Validation error, return cap violation, supplier change restriction, or insufficient batch stock
        '401':
          description: Unauthorized
        '404':
          description: Purchase not found

components:
  schemas:
    PurchaseLineInput:
      type: object
      required:
        - itemId
        - lineTotal
        - expiryDate
      properties:
        itemId:
          type: integer
          minimum: 1
          example: 1
        packs:
          type: number
          minimum: 0
          maximum: 1000000
          example: 10
          description: Number of packs purchased (mutually exclusive with baseQty)
        baseQty:
          type: integer
          minimum: 1
          maximum: 2000000000
          example: 25000
          description: Base unit quantity purchased (mutually exclusive with packs)
        lineTotal:
          type: number
          minimum: 0
          example: 7500.00
          description: Total cost for this line item
        expiryDate:
          type: string
          format: date
          nullable: true
          example: '2028-12-31'
          description: Expiry date in YYYY-MM-DD format (null if non-expiring)

    CreatePurchaseInput:
      type: object
      required:
        - supplierId
        - lines
      properties:
        supplierId:
          type: integer
          minimum: 1
          example: 1
        date:
          type: string
          format: date
          example: '2026-10-11'
          description: Purchase date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Invoice delivered via refrigerated truck'
        paid:
          type: number
          minimum: 0
          default: 0
          example: 5000.00
          description: Amount paid immediately upon purchase
        discount:
          type: number
          minimum: 0
          default: 0
          example: 200.00
          description: Invoice-level discount
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PurchaseLineInput'

    PurchaseLineResponse:
      type: object
      properties:
        id:
          type: integer
          example: 12
        purchaseId:
          type: integer
          example: 5
        itemId:
          type: integer
          example: 1
        baseQty:
          type: integer
          example: 25000
        lineTotal:
          type: number
          example: 7500.00
        batchId:
          type: integer
          example: 8
        packs:
          type: number
          nullable: true
          example: 10.0
        hasExpiry:
          type: boolean
          example: true
        item:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Urea Fertilizer 46%'
            unit:
              type: string
              example: 'GRAM'
            packName:
              type: string
              nullable: true
              example: 'Sack'
            packSize:
              type: integer
              nullable: true
              example: 2500
        batch:
          type: object
          properties:
            id:
              type: integer
              example: 8
            expiryDate:
              type: string
              format: date-time
              nullable: true
              example: '2028-12-31T00:00:00.000Z'
            unitCost:
              type: number
              example: 0.30
            qtyRemaining:
              type: integer
              example: 25000

    PurchaseReturnSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-15T10:00:00.000Z'
        total:
          type: number
          example: 1500.00
        cashRefund:
          type: number
          example: 500.00

    PurchaseDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 5
        supplierId:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: '2026-10-11T00:00:00.000Z'
        discount:
          type: number
          example: 200.00
        total:
          type: number
          example: 7300.00
        paid:
          type: number
          example: 5000.00
        note:
          type: string
          nullable: true
          example: 'Invoice delivered via refrigerated truck'
        subtotal:
          type: number
          example: 7500.00
        supplier:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Delta AgriChem Supplies'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseLineResponse'
        purchaseReturns:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReturnSummaryResponse'

    UpdatePurchaseInput:
      type: object
      description: All fields are optional (partial update)
      properties:
        supplierId:
          type: integer
          minimum: 1
          example: 1
          description: Cannot be changed if purchase items have active returns
        date:
          type: string
          format: date
          example: '2026-10-12'
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated invoice notes and adjusted line quantities'
        paid:
          type: number
          minimum: 0
          example: 6000.00
        discount:
          type: number
          minimum: 0
          example: 250.00
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PurchaseLineInput'
          description: Replacing lines will recalculate batch inventories and enforce return quantity caps
