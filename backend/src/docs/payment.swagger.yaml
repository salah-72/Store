openapi: 3.0.0
info:
  title: Agricultural Store API - Payments Module
  version: 1.0.0
  description: Customer Collections, Supplier Disbursements, and Financial Settlement API Documentation.

paths:
  /payments:
    get:
      summary: List payments with pagination, party filters, type checks, and date ranges
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of payment records per page
        - in: query
          name: customerId
          schema:
            type: integer
            minimum: 1
          description: Filter payments by specific customer ID
        - in: query
          name: supplierId
          schema:
            type: integer
            minimum: 1
          description: Filter payments by specific supplier ID
        - in: query
          name: type
          schema:
            type: string
            enum: [customer, supplier]
          description: Filter by party type (customer for cash collections, supplier for disbursements)
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-01-01'
          description: Start date filter (YYYY-MM-DD)
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-12-31'
          description: End date filter (YYYY-MM-DD, inclusive)
      responses:
        '200':
          description: Payments retrieved successfully with summary totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentListItemResponse'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  amount:
                    type: number
                    example: 25500.00
                    description: Total sum of payment amounts matching the filter criteria
        '400':
          description: Invalid query parameters, date range, or conflicting party type filters
        '401':
          description: Unauthorized

    post:
      summary: Create New Payment (Customer Collection or Supplier Disbursement)
      tags:
        - Payments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentInput'
      responses:
        '201':
          description: Payment recorded successfully and party balance updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          description: Validation error, missing party ID, or passing both customerId and supplierId
        '401':
          description: Unauthorized
        '404':
          description: Customer or Supplier not found

  /payments/{id}:
    get:
      summary: Get Payment Details by ID
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Payment ID
      responses:
        '200':
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

    patch:
      summary: Update Payment Details (Amount, Date, Notes)
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Payment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentInput'
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          description: Validation error, empty update body, or invalid payment amount
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

    delete:
      summary: Delete Payment Record
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Payment ID
      responses:
        '200':
          description: Payment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 10
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

components:
  schemas:
    CreatePaymentInput:
      type: object
      required:
        - amount
      properties:
        customerId:
          type: integer
          minimum: 1
          example: 1
          description: Target Customer ID (mutually exclusive with supplierId)
        supplierId:
          type: integer
          minimum: 1
          example: 3
          description: Target Supplier ID (mutually exclusive with customerId)
        amount:
          type: number
          minimum: 0.01
          example: 5000.00
          description: Payment amount (must be greater than zero)
        date:
          type: string
          format: date
          example: '2026-10-14'
          description: Payment date in YYYY-MM-DD format (defaults to current Cairo date if omitted)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Cash collection installment for outstanding invoice balance'

    PartyResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'El-Giza Agricultural Cooperative'
        phone:
          type: string
          nullable: true
          example: '01012345678'

    PaymentDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        customerId:
          type: integer
          nullable: true
          example: 1
        supplierId:
          type: integer
          nullable: true
          example: null
        amount:
          type: number
          example: 5000.00
        date:
          type: string
          format: date-time
          example: '2026-10-14T00:00:00.000Z'
        note:
          type: string
          nullable: true
          example: 'Cash collection installment'
        type:
          type: string
          enum: [CUSTOMER, SUPPLIER]
          example: 'CUSTOMER'
        direction:
          type: string
          enum: [IN, OUT]
          example: 'IN'
          description: IN for customer cash collections, OUT for supplier cash disbursements
        party:
          $ref: '#/components/schemas/PartyResponse'
        currentBalance:
          type: number
          example: 2400.00
          description: Updated remaining balance of the customer or supplier after this payment
        hasCredit:
          type: boolean
          example: false
          description: True if the party currently holds an advance credit balance (negative remaining balance)

    UpdatePaymentInput:
      type: object
      description: All fields are optional (partial update for payment metadata)
      properties:
        amount:
          type: number
          minimum: 0.01
          example: 5500.00
          description: Updated payment amount (must be greater than zero)
        date:
          type: string
          format: date
          example: '2026-10-15'
          description: Payment date in YYYY-MM-DD format
        note:
          type: string
          maxLength: 500
          nullable: true
          example: 'Updated collection notes regarding receipt verification'

    PaymentListItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        customerId:
          type: integer
          nullable: true
          example: 1
        supplierId:
          type: integer
          nullable: true
          example: null
        amount:
          type: number
          example: 5000.00
        date:
          type: string
          format: date-time
          example: '2026-10-14T00:00:00.000Z'
        note:
          type: string
          nullable: true
          example: 'Cash collection installment'
        type:
          type: string
          enum: [CUSTOMER, SUPPLIER]
          example: 'CUSTOMER'
        direction:
          type: string
          enum: [IN, OUT]
          example: 'IN'
        party:
          $ref: '#/components/schemas/PartyResponse'

    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
