openapi: 3.0.0
info:
  title: Agricultural Store API - Auth Module
  version: 1.0.0
  description: Authentication and Admin User Management API Documentation.

paths:
  /auth/login:
    post:
      summary: Admin Login
      tags:
        - Auth
      description: Authenticate admin credentials, return Access Token, and set HTTP-Only Refresh Token Cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc123xyz...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    $ref: '#/components/schemas/AdminResponse'
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid username or password
        '429':
          description: Too many requests, rate limit exceeded

  /auth/newAdmin:
    post:
      summary: Create New Admin
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminInput'
      responses:
        '201':
          description: Admin account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '400':
          description: Username already exists or validation error
        '401':
          description: Unauthorized (Token missing or invalid)

  /auth/logout:
    post:
      summary: Admin Logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully and cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: success
                  message:
                    type: string
                    example: logout successfully
        '400':
          description: Refresh token not found
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      summary: Refresh Access Token
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional if cookie is provided
      responses:
        '200':
          description: Access token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  accessToken:
                    type: string
        '401':
          description: Refresh token missing or expired

  /auth/password:
    patch:
      summary: Update Current Admin Password
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordInput'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: password changed successfully, please log in again
        '401':
          description: Invalid old password or invalid token

  /auth/admins:
    get:
      summary: Get All Admins
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of admins retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      admins:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminResponse'
        '401':
          description: Unauthorized

  /auth/{adminId}:
    delete:
      summary: Delete Admin Account
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: adminId
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID of the admin account to delete
      responses:
        '204':
          description: Admin deleted successfully
        '400':
          description: Cannot delete the only remaining admin account
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token

  schemas:
    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          example: admin_main
        password:
          type: string
          minLength: 6
          maxLength: 50
          example: '123456'

    CreateAdminInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          example: new_admin
        password:
          type: string
          minLength: 6
          maxLength: 50
          example: '123456'

    UpdatePasswordInput:
      type: object
      required:
        - oldPassword
        - newPassword
        - passwordConfirm
      properties:
        oldPassword:
          type: string
          example: '123456'
        newPassword:
          type: string
          minLength: 6
          maxLength: 50
          example: 'newpassword123'
        passwordConfirm:
          type: string
          minLength: 6
          maxLength: 50
          example: 'newpassword123'

    AdminResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin_main
